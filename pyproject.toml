[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "five3one"
version = "0.3.0"
description = "Stdlib-only CLI for reading Five3One (5/3/1 BBB) CSV exports"
requires-python = ">=3.9"

[project.scripts]
five3one = "five3one.cli:main"

[tool.setuptools]
packages = ["five3one"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
